name: GITEE-MIRROR-05 (Gitee架子全阵列·拍43·10公仓→chepin-ci·名级用钥)
'on':
  workflow_dispatch:
permissions:
  contents: read
env:
  GITEE_TOK: ${{ secrets.GITEE_TOK }}
jobs:
  mirrorall:
    runs-on: ubuntu-latest
    steps:
      - name: mirror-all
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, subprocess
          TOK=os.environ.get('GITEE_TOK','')
          REPOS=['vci-vinf','vci-lgt','vci-usrm','vci-qfa','vci-qtlv','vci-ucif2','vci-qgl','vci-cfts','vci-qlv','vci-lvlu','vci-inbox']
          def api(method,url,data=None):
              sep='&' if '?' in url else '?'
              rq=urllib.request.Request(url+sep+'access_token='+TOK,data=data,headers={'Content-Type':'application/json'},method=method)
              try:
                  with urllib.request.urlopen(rq,timeout=30) as r: return r.status, json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e: return e.code, {}
          stu,ju=api('GET','https://gitee.com/api/v5/user')
          user=ju.get('login','') if stu==200 else ''
          out={'user':user,'mirrors':{}}
          for repo in REPOS:
              st,_=api('GET','https://gitee.com/api/v5/repos/%s/%s'%(user,repo))
              if st==404 and user:
                  body=json.dumps({'name':repo,'private':True,'auto_init':False}).encode()
                  st2,_=api('POST','https://gitee.com/api/v5/user/repos',body)
              q1=subprocess.run(['git','clone','--mirror','https://github.com/chepin-ai/%s.git'%repo,'src.git'],capture_output=True,text=True)
              if q1.returncode!=0:
                  out['mirrors'][repo]='clone_fail'; continue
              q2=subprocess.run(['git','--git-dir','src.git','push','--mirror','https://%s:%s@gitee.com/%s/%s.git'%(user,TOK,user,repo)],capture_output=True,text=True)
              out['mirrors'][repo]='ok' if q2.returncode==0 else 'fail:'+(q2.stderr[-60:].replace(TOK,'***'))
              subprocess.run(['rm','-rf','src.git'])
          print(json.dumps({'gitee_mirror_all':'done',**out},ensure_ascii=False))
          PYEOF
