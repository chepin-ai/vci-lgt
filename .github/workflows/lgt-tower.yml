name: LGT-TOWER-01
on:
  # CRON-BAN-02 奉裁卸除 schedule 块（cisvr-241 裁违，lvlu 代刀执行 20260910）
  # 事驱五道自足：push/issues/issue_comment/repository_dispatch/workflow_dispatch
  # 正名：钟驱非自持，事驱方自持——点火在事件，不在表。
  push:
    paths: ['inbox/**', 'ci/lgt_tower.py', '.github/workflows/lgt-tower.yml']
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [lgt-wake, lgt-tower-cascade, lgt-tower-kick, federation-event]
  workflow_dispatch:
    inputs:
      selftest:
        description: 'run selftest only'
        required: false
        default: 'no'

permissions:
  contents: write
  actions: write

concurrency:
  group: lgt-tower-${{ github.event_name == 'repository_dispatch' && 'chain' || 'edge' }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

jobs:
  tower:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: lgt-tower --once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_PAT: ${{ secrets.AI_FULL_PAT }}  # NAME-HYGIENE-97(qfa代改,覆写权归原线): CI_OPS_LINE_KEY=线App PEM(root复位中),PAT面归AI_FULL_PAT
          GITHUB_SHA: ${{ github.sha }}
        run: python3 ci/lgt_tower.py

  mesh-wake:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: mesh-wake hub
        env:
          MESH_PAT: ${{ secrets.CI_OPS_LINE_KEY }}
        run: |
          [ -n "$MESH_PAT" ] || { echo "no hub key, skip"; exit 0; }
          curl -sS -m 20 -X POST -H "Authorization: token $MESH_PAT" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/chepin-ai/ci-worker-01/dispatches \
            -d '{"event_type":"federation-event","client_payload":{"src":"lgt-tower","kind":"mesh-wake","sha":"${{ github.sha }}"}}' \
            -o /dev/null -w "mesh-wake http=%{http_code}\n" || true
