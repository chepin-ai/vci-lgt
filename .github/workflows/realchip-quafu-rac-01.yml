# CLASSIFY: L1
name: QUAFU-RAC-LGT-01
on:
  workflow_dispatch:
    inputs:
      mode:
        description: SIM, FIRE, or RETRIEVE
        required: true
        default: SIM
        type: choice
        options: [SIM, FIRE, RETRIEVE]
      task_id:
        description: Existing task id for RETRIEVE only
        required: false
        type: string
      confirmation:
        description: FIRE requires V147-ONE-SEND
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: quafu-rac-lgt-01-production
  cancel-in-progress: false
jobs:
  rac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyquafu==0.4.5
      - name: RAC simulation gate and preregistered platform operation
        id: rac
        env:
          MODE: ${{ inputs.mode }}
          TASK_ID: ${{ inputs.task_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          QUAFU_KEY: ${{ secrets.QUAFU_KEY }}
          RECEIPT_PATH: receipts/quafu-rac-${{ github.run_id }}-attempt-${{ github.run_attempt }}.json
        run: python ci/realchip_quafu_rac.py
      - name: Commit mandatory evidence; false or missing receipts fail after bounded push
        if: always()
        env:
          RECEIPT_PATH: receipts/quafu-rac-${{ github.run_id }}-attempt-${{ github.run_attempt }}.json
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          python ci/quafu_rac_workflow_guard.py ensure "$RECEIPT_PATH"
          receipt_ok="$(python ci/quafu_rac_workflow_guard.py ok "$RECEIPT_PATH")"
          git config user.name lgt-bot
          git config user.email lgt-bot@users.noreply.github.com
          git add "$RECEIPT_PATH" ci/QUAFU-RAC-RETRIEVAL-HISTORY-LGT-01.json
          if ! git diff --cached --quiet; then
            git commit -m "QUAFU-RAC receipt ${{ github.run_id }} attempt ${{ github.run_attempt }}"
          fi
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            if ! git pull --rebase origin main; then exit 1; fi
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then echo "evidence push failed"; exit 1; fi
          if [ "$receipt_ok" != "true" ]; then echo "receipt is false or invalid; workflow success forbidden"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quafu-rac-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            receipts/quafu-rac-${{ github.run_id }}-attempt-${{ github.run_attempt }}.json
            ci/QUAFU-RAC-RETRIEVAL-HISTORY-LGT-01.json
          if-no-files-found: error
